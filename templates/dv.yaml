apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: {VM_BASENAME}-base
  namespace: {vm-ns}
  labels:
    batch-id: "{BATCH_ID}"
    vm-basename: "{VM_BASENAME}"
  {DV_ANNOTATIONS}
spec:
  source:
    http:
      url: {DV_URL}
  pvc:
    accessModes:
      - {ACCESS_MODE}
    resources:
      requests:
        storage: {STORAGE_SIZE}
    volumeMode: {VOLUME_MODE}
    storageClassName: {STORAGE_CLASS}
