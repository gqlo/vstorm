<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vstorm workload results</title>
  <link rel="stylesheet" href="style.css?v=4" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
          integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
          crossorigin="anonymous"
          defer></script>
  <script src="dashboard-lib.js?v=6" defer></script>
  <script src="app.js?v=16" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="brand-title" href="#/runs">vstorm workload results</a>
      <div class="top-actions">
        <label class="api-base" title="Collector API origin. Empty = same origin as this page. Default is the PerfScale lab collector.">
          <span>API</span>
          <input type="text" id="api-base"
                 placeholder="http://n42-h01-b02-mx750c.rdu3.labs.perfscale.redhat.com:8080"
                 spellcheck="false"
                 autocomplete="off" />
        </label>
        <button type="button" id="btn-api-apply" class="btn">Apply</button>
        <button type="button" id="btn-refresh" class="btn">Refresh</button>
        <label class="auto">
          <input type="checkbox" id="auto-refresh" />
          Auto
        </label>
      </div>
    </div>
    <p class="brand-desc">Collect and browse batch VM create / boot / workload timings from <a href="https://github.com/gqlo/vstorm" target="_blank" rel="noopener noreferrer">vstorm</a> (spawn VMs in a batch on OpenShift Virtualization). All timestamps are UTC.</p>
  </header>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
  <main id="app" class="app">Loading…</main>
</body>
</html>
