#cloud-config
preserve_hostname: false
ssh_pwauth: true
disable_root: false
chpasswd:
  expire: false
  users:
    - name: root
      password: password
      type: text

packages:
  - stress-ng
  - curl
  - python3

write_files:
  - path: /opt/stress_ng_random_vm.sh
    permissions: '0755'
    content: |
      {STRESS_NG_WORKLOAD_SCRIPT}
  - path: /opt/vstorm-boot-timestamp.sh
    permissions: '0755'
    content: |
      {VSTORM_BOOT_SCRIPT}

  - path: /etc/systemd/system/vstorm-boot-timestamp.service
    permissions: '0644'
    content: |
      {VSTORM_BOOT_SERVICE}

  - path: /etc/default/vstorm-guest-env
    permissions: '0644'
    content: |
      {VSTORM_GUEST_ENV}

  - path: /etc/systemd/system/stress-workload.service
    permissions: '0644'
    content: |
      {STRESS_NG_WORKLOAD_SERVICE}

runcmd:
  - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
  - sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - systemctl restart sshd 2>/dev/null || systemctl restart ssh
  - ["systemctl", "daemon-reload"]
  - ["systemctl", "enable", "--now", "vstorm-boot-timestamp.service"]
  - ["systemctl", "enable", "--now", "stress-workload.service"]
