#cloud-config
preserve_hostname: false
# Dirty-rate guest workload (compile + systemd). vstorm example:
#   ./vstorm ... --cloudinit=workload/cloudinit-dirty-mem-pages.yaml --env DIRTY_RATE_FRACTION=0.4
# DIRTY_RATE_FRACTION is a fraction of total physical RAM (0.1–0.9, e.g. 0.9 = 90%); see dirty-mem-pages.c.
# Default 0.5 if --env omitted (Environment= in the systemd unit).
ssh_pwauth: true
disable_root: false
chpasswd:
  expire: false
  users:
    - name: root
      password: password
      type: text
packages:
  - gcc
  - curl
  - python3
write_files:
  - path: /usr/local/src/dirty-mem-pages.c
    permissions: '0644'
    content: |
      #include <errno.h>
      #include <stdint.h>
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>
      #include <time.h>
      #include <unistd.h>
      #include <sys/mman.h>
      #include <ctype.h>
      static void usage(const char *prog) {
          fprintf(stderr,
                  "usage: %s <value>\n"
                  "  value: - a fraction of physical RAM (e.g., 0.5)\n"
                  "         - an explicit byte count (e.g., 1073741824)\n"
                  "         - a human-readable size (e.g., 512M, 2G, 4KB, 1.5G)\n\n"
                  "  Allocates a buffer of that size and dirties it at one full\n"
                  "  pass per second (dirty rate equals buffer size per second).\n",
                  prog);
      }
      /* Parses a string into bytes. Supports fractions (0.1-0.9) and units (K, M, G, T). */
      static int parse_input(const char *str, uint64_t mem_total, uint64_t *out_bytes) {
          char *endptr = NULL;
          errno = 0;
          double val = strtod(str, &endptr);
          if (errno != 0 || endptr == str) {
              return -1;
          }
          while (isspace((unsigned char)*endptr)) {
              endptr++;
          }
          if (*endptr == '\0') {
              if (val <= 0.0)
                  return -1;
              if (val < 1.0) {
                  if (val < 0.1 || val > 0.9)
                      return -2;
                  *out_bytes = (uint64_t)(mem_total * val);
                  return 0;
              }
              *out_bytes = (uint64_t)val;
              return 0;
          }
          char unit = tolower((unsigned char)*endptr);
          endptr++;
          if (tolower((unsigned char)*endptr) == 'i')
              endptr++;
          if (tolower((unsigned char)*endptr) == 'b')
              endptr++;
          if (*endptr != '\0')
              return -1;
          double multiplier = 1.0;
          switch (unit) {
              case 'k': multiplier = 1024.0; break;
              case 'm': multiplier = 1024.0 * 1024.0; break;
              case 'g': multiplier = 1024.0 * 1024.0 * 1024.0; break;
              case 't': multiplier = 1024.0 * 1024.0 * 1024.0 * 1024.0; break;
              default: return -1;
          }
          *out_bytes = (uint64_t)(val * multiplier);
          return 0;
      }
      int main(int argc, char **argv) {
          if (argc != 2) {
              usage(argv[0]);
              return 1;
          }
          long psz = sysconf(_SC_PAGESIZE);
          if (psz <= 0) {
              perror("sysconf(_SC_PAGESIZE)");
              return 1;
          }
          const size_t page = (size_t)psz;
          long phys_pages = sysconf(_SC_PHYS_PAGES);
          if (phys_pages < 0) {
              perror("sysconf(_SC_PHYS_PAGES)");
              return 1;
          }
          uint64_t mem_total = (uint64_t)phys_pages * (uint64_t)page;
          uint64_t bytes = 0;
          int rc = parse_input(argv[1], mem_total, &bytes);
          if (rc == -1) {
              fprintf(stderr, "%s: invalid input string: %s\n", argv[0], argv[1]);
              return 1;
          } else if (rc == -2) {
              fprintf(stderr, "%s: fraction must be between 0.1 and 0.9\n", argv[0]);
              return 1;
          }
          uint64_t max_bytes = (uint64_t)(mem_total * 0.9);
          if (bytes > max_bytes) {
              fprintf(stderr, "%s: requested size (%llu B) exceeds usable limit (%llu B, 90%% of %llu B RAM)\n",
                      argv[0],
                      (unsigned long long)bytes,
                      (unsigned long long)max_bytes,
                      (unsigned long long)mem_total);
              return 1;
          }
          bytes -= bytes % page;
          if (bytes < page)
              bytes = page;
          const size_t TOTAL = (size_t)bytes;
          const size_t n_pages = TOTAL / page;
          const size_t DIRTY_PER_SEC = TOTAL;
          const size_t PAGES_PER_SEC = DIRTY_PER_SEC / page;
          fprintf(stderr,
                  "%s: phys_ram=%llu MiB buffer=%zu MiB dirty=%zu MiB/s page=%zu\n",
                  argv[0],
                  (unsigned long long)(mem_total / (1024 * 1024)),
                  TOTAL / (1024 * 1024),
                  DIRTY_PER_SEC / (1024 * 1024),
                  page);
          void *buf = mmap(NULL, TOTAL, PROT_READ | PROT_WRITE,
                           MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
          if (buf == MAP_FAILED) {
              perror("mmap");
              return 1;
          }
          char *mem = (char *)buf;
          size_t page_idx = 0;
          while (1) {
              struct timespec start, end_ts;
              clock_gettime(CLOCK_MONOTONIC, &start);
              for (size_t i = 0; i < PAGES_PER_SEC; i++) {
                  mem[page_idx * page] = (char)i;
                  page_idx = (page_idx + 1) % n_pages;
              }
              clock_gettime(CLOCK_MONOTONIC, &end_ts);
              long elapsed_us = (end_ts.tv_sec - start.tv_sec) * 1000000L
                              + (end_ts.tv_nsec - start.tv_nsec) / 1000;
              long remaining = 1000000L - elapsed_us;
              if (remaining > 0)
                  usleep((useconds_t)remaining);
              printf("dirtied %zu MiB, elapsed %ld us, sleep %ld us\n",
                     DIRTY_PER_SEC / (1024 * 1024), elapsed_us,
                     remaining > 0 ? remaining : 0);
              fflush(stdout);
          }
      }
  - path: /opt/vstorm-boot-timestamp.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Shared guest boot timestamp: append /root/timestamp.txt and optionally POST a
      # heartbeat with boot_timestamp when RESULT_SERVER_URL + VSTORM_BATCH_ID are set.
      #
      # Single source of truth for the guest boot agent. Cloud-init profiles embed a
      # copy under write_files (path /opt/vstorm-boot-timestamp.sh); keep those embeds
      # identical (tests/15-boot-timestamp.bats checks byte-for-byte parity).
      set -euo pipefail

      BOOT_TIMESTAMP_FILE="${RESULT_TIMESTAMP_FILE:-/root/timestamp.txt}"
      mkdir -p "$(dirname "$BOOT_TIMESTAMP_FILE")"

      _ts_unix=$(date -u +%s)
      _ts_human=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
      if [[ -f "$BOOT_TIMESTAMP_FILE" ]]; then
          printf '%s, %s\n' "$_ts_unix" "$_ts_human" >> "$BOOT_TIMESTAMP_FILE"
      else
          printf '%s, %s\n' "$_ts_unix" "$_ts_human" > "$BOOT_TIMESTAMP_FILE"
      fi

      BOOT_TIMESTAMP_UNIX=""
      while IFS=',' read -r _bu _bt || [[ -n "${_bu:-}" ]]; do
          _bu="${_bu//[[:space:]]/}"
          if [[ "$_bu" =~ ^[0-9]+$ ]]; then
              BOOT_TIMESTAMP_UNIX="$_bu"
              break
          fi
      done < "$BOOT_TIMESTAMP_FILE"
      if [[ -z "$BOOT_TIMESTAMP_UNIX" ]]; then
          echo "WARN: no numeric boot unix in $BOOT_TIMESTAMP_FILE; using service start" >&2
          BOOT_TIMESTAMP_UNIX="$_ts_unix"
      fi

      echo "vstorm-boot-timestamp: file=$BOOT_TIMESTAMP_FILE boot_unix=$BOOT_TIMESTAMP_UNIX service_unix=$_ts_unix"

      [[ -n "${RESULT_SERVER_URL:-}" ]] || exit 0
      if [[ -z "${VSTORM_BATCH_ID:-}" ]]; then
          echo "RESULT_SERVER_URL set but VSTORM_BATCH_ID unset; skip boot heartbeat POST" >&2
          exit 0
      fi
      if ! command -v python3 &>/dev/null; then
          echo "python3 missing; skip boot heartbeat POST" >&2
          exit 0
      fi
      if ! command -v curl &>/dev/null; then
          echo "curl missing; skip boot heartbeat POST" >&2
          exit 0
      fi

      vm_name="${VSTORM_VM_NAME:-$(hostname -s 2>/dev/null || hostname || echo unknown)}"
      hostname_s=$(hostname -s 2>/dev/null || hostname || echo unknown)
      payload_file=$(mktemp)
      trap 'rm -f "$payload_file"' EXIT

      python3 - "$payload_file" "$BOOT_TIMESTAMP_UNIX" "$_ts_unix" \
          "$hostname_s" "${VSTORM_BATCH_ID}" "$vm_name" <<'PY'
      import json, sys
      from datetime import datetime, timezone

      def fmt_utc(unix):
          return datetime.fromtimestamp(int(unix), tz=timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

      out, boot_unix, service_unix, hostname, batch_id, vm_name = sys.argv[1:7]
      boot_unix = int(boot_unix)
      service_unix = int(service_unix)
      now = service_unix
      payload = {
          "schema_version": 1,
          "record_type": "heartbeat",
          "source": "guest",
          "workload_kind": "boot",
          "status": "booted",
          "agent_state": "booted",
          "boot_timestamp": fmt_utc(boot_unix),
          "service_start": fmt_utc(service_unix),
          "reported_at": fmt_utc(now),
          "hostname": hostname,
          "batch_id": batch_id,
          "vm_name": vm_name,
      }
      with open(out, "w", encoding="utf-8") as f:
          json.dump(payload, f)
          f.write("\n")
      PY

      RESULT_RETRY="${RESULT_RETRY:-3}"
      RESULT_TIMEOUT="${RESULT_TIMEOUT:-30}"
      auth_args=()
      [[ -n "${RESULT_SERVER_TOKEN:-}" ]] && auth_args+=(-H "Authorization: Bearer ${RESULT_SERVER_TOKEN}")
      attempt=1
      while (( attempt <= RESULT_RETRY )); do
          http_code=$(curl -sS -X POST -H "Content-Type: application/json" \
              --data-binary @"$payload_file" \
              --connect-timeout "$RESULT_TIMEOUT" \
              --max-time "$RESULT_TIMEOUT" \
              "${auth_args[@]}" \
              -o /tmp/vstorm-boot-post.body -w '%{http_code}' \
              "$RESULT_SERVER_URL" 2>/tmp/vstorm-boot-post.err) || true
          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Boot heartbeat posted to $RESULT_SERVER_URL"
              exit 0
          fi
          echo "Boot heartbeat POST failed attempt $attempt/$RESULT_RETRY: HTTP ${http_code:-000}"
          sleep $((attempt < 4 ? attempt * 2 : 8))
          ((attempt++)) || true
      done
      echo "Boot heartbeat POST failed after retries (file still written)" >&2
      exit 0
  - path: /etc/systemd/system/vstorm-boot-timestamp.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Record guest boot timestamp and optional collector heartbeat
      After=network-online.target network.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      EnvironmentFile=-/etc/default/vstorm-guest-env
      ExecStart=/opt/vstorm-boot-timestamp.sh
      Restart=no
      [Install]
      WantedBy=multi-user.target
  - path: /etc/default/vstorm-guest-env
    permissions: '0644'
    content: |
      {VSTORM_GUEST_ENV}
  - path: /etc/systemd/system/dirty-mem-pages.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Dirty anonymous pages at a steady rate (fraction of RAM; see dirty-mem-pages.c)
      After=network.target vstorm-boot-timestamp.service
      Wants=vstorm-boot-timestamp.service
      [Service]
      Type=simple
      EnvironmentFile=-/etc/default/vstorm-guest-env
      Environment=DIRTY_RATE_FRACTION=0.5
      ExecStart=/usr/local/bin/dirty-mem-pages $DIRTY_RATE_FRACTION
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      [Install]
      WantedBy=multi-user.target
runcmd:
  - sed -i "s/^#\?PermitRootLogin.*/PermitRootLogin yes/" /etc/ssh/sshd_config
  - sed -i "s/^#\?PasswordAuthentication.*/PasswordAuthentication yes/" /etc/ssh/sshd_config
  - systemctl restart sshd 2>/dev/null || systemctl restart ssh
  - cc -Wall -Wextra -O2 -o /usr/local/bin/dirty-mem-pages /usr/local/src/dirty-mem-pages.c
  - ["systemctl", "daemon-reload"]
  - ["systemctl", "enable", "--now", "vstorm-boot-timestamp.service"]
  - ["systemctl", "enable", "--now", "dirty-mem-pages.service"]
